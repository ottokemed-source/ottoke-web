# After a save in Pages CMS: cuts the background out of a new norigae or hairpin photo and
# makes its share image (tools/procesar_fotos.py), then commits the result to the draft.
# A push made with GITHUB_TOKEN starts no workflow, so this commit does not run it again.
name: Recortar fotos

on:
  push:
    branches: [borrador]
    paths:
      - src/content/norigae/**
      - src/content/horquillas/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recortar
  cancel-in-progress: false

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: borrador
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      # the background model (about 200 MB) downloads once, then comes from the cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.u2net
          key: rembg-birefnet-general-lite
      - run: pip install -r tools/requirements.txt
      - run: python tools/procesar_fotos.py
      # the cuts that worked are kept even when one photo failed (the run still shows failed)
      - name: Guardar recortes
        if: success() || failure()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ottoke-bot"
            git config user.email "ottoke-bot@users.noreply.github.com"
            git add src/content src/assets public/og
            git commit -m "Recortar fotos nuevas"
            git push origin borrador
          fi
